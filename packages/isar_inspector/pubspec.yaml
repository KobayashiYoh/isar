name: isar_inspector
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.5 <4.0.0"
  flutter: ">=3.47.7"

dependencies:
  clickup_fading_scroll:
    git:
      url: https://github.com/clickup/clickup_fading_scroll
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  go_router: ^5.0.0
  google_fonts: 6.1.0
  isar:
    path: ../isar
  vm_service: ^11.0.0
  web_socket_channel: ^2.2.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^2.0.1
  very_good_analysis: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
